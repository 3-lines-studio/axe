cargo-features = ["panic-immediate-abort"]

[package]
name = "axe"
version = "0.1.7"
edition = "2024"
description = "Minimal LLM coding agent harness"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
strip = "symbols"

[profile.dev]
opt-level = 1
