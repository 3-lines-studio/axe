cargo-features = ["panic-immediate-abort"]

[package]
name = "axe"
version = "0.1.0"
edition = "2024"
description = "Minimal LLM coding agent harness"
license = "MIT"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-markdown", "dep:unicode-width"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"], optional = true }
crossterm = { version = "0.29.0", optional = true }
tui-markdown = { version = "0.3.9", default-features = false, optional = true }
unicode-width = { version = "0.2", optional = true }
dom_query = "0.28"
dom_smoothie = "0.18"
encoding_rs = "0.8"
htmd = "0.5"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
strip = "symbols"

[profile.dev]
opt-level = 1
