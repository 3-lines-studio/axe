name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup default nightly && rustup component add rust-src
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: axe-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum axe-linux-x86_64 axe-linux-aarch64 axe-darwin-aarch64 > SHA256SUMS
          cp "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
          gh release create "$GITHUB_REF_NAME" axe-* SHA256SUMS install.sh \
            --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
